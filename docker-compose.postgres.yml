name: cfi-fed

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cfi
      POSTGRES_PASSWORD: cfi
      POSTGRES_DB: cfifed
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfi -d cfifed"]
      interval: 5s
      timeout: 5s
      retries: 5

  registry:
    build: .
    command: python services/registry/main.py
    environment:
      CFI_DATABASE_URL: postgresql://cfi:cfi@postgres:5432/cfifed
      CFI_HOST: 0.0.0.0
      CFI_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  coordinator:
    build: .
    command: uvicorn services.coordinator.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  aggregator:
    build: .
    command: python services/aggregator/main.py
    environment:
      CFI_TOTAL_EPSILON: "10.0"
      CFI_HOST: 0.0.0.0
      CFI_PORT: 8002
    ports:
      - "8002:8002"

  replay_mock:
    build: .
    command: python services/replay_mock/main.py
    environment:
      CFI_HOST: 0.0.0.0
      CFI_PORT: 8010
    ports:
      - "8010:8010"

volumes:
  pg_data:
