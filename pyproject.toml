[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfi-fed"
version = "0.1.0"
description = "Privacy-preserving Causal Failure Invariant federation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.12",
    "cryptography>=42.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "jsonschema>=4.21",
    "opentelemetry-api>=1.23",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-jsonschema",
]

[project.scripts]
cfi-contribute = "cfi_cli.contribute:app"
cfi-registry = "cfi_cli.registry:app"
cfi-recipient = "cfi_cli.recipient:app"
cfi-aggregate = "cfi_cli.aggregate:app"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/cfi_core/src/cfi_core",
    "packages/cfi_contributor/src/cfi_contributor",
    "packages/cfi_registry/src/cfi_registry",
    "packages/cfi_recipient/src/cfi_recipient",
    "packages/cfi_federation/src/cfi_federation",
    "packages/cfi_governance/src/cfi_governance",
    "packages/cfi_cli/src/cfi_cli",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cfi_core", "cfi_contributor", "cfi_registry", "cfi_recipient", "cfi_federation", "cfi_governance", "cfi_cli"]
mypy_path = [
    "packages/cfi_core/src",
    "packages/cfi_contributor/src",
    "packages/cfi_registry/src",
    "packages/cfi_recipient/src",
    "packages/cfi_federation/src",
    "packages/cfi_governance/src",
    "packages/cfi_cli/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/cfi_core/src",
    "packages/cfi_contributor/src",
    "packages/cfi_registry/src",
    "packages/cfi_recipient/src",
    "packages/cfi_federation/src",
    "packages/cfi_governance/src",
    "packages/cfi_cli/src",
    "eval",
    "services",
    "examples/retail_to_procurement",
    "examples/retail_to_healthcare",
    "examples/retail_to_dataops",
]

[tool.ruff]
line-length = 100
target-version = "py311"
