worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream registry {
        server registry:8000;
    }
    upstream coordinator {
        server coordinator:8001;
    }
    upstream aggregator {
        server aggregator:8002;
    }
    upstream replay_mock {
        server replay_mock:8010;
    }

    server {
        listen 443 ssl;
        server_name localhost cfi-fed.local;

        ssl_certificate     /etc/nginx/certs/server.cert.pem;
        ssl_certificate_key /etc/nginx/certs/server.key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /registry/ {
            proxy_pass http://registry/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /coordinator/ {
            proxy_pass http://coordinator/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /aggregator/ {
            proxy_pass http://aggregator/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /replay/ {
            proxy_pass http://replay_mock/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
