apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfi-aggregator
  namespace: {{ .Values.namespace }}
  labels:
    app: cfi-aggregator
    {{- include "cfi-fed.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aggregator.replicas }}
  selector:
    matchLabels:
      app: cfi-aggregator
  template:
    metadata:
      labels:
        app: cfi-aggregator
    spec:
      containers:
        - name: aggregator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "services/aggregator/main.py"]
          ports:
            - containerPort: {{ .Values.aggregator.port }}
          envFrom:
            - configMapRef:
                name: cfi-fed-config
          env:
            - name: CFI_HOST
              value: "0.0.0.0"
            - name: CFI_PORT
              value: {{ .Values.aggregator.port | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.aggregator.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cfi-aggregator
  namespace: {{ .Values.namespace }}
  labels:
    app: cfi-aggregator
spec:
  selector:
    app: cfi-aggregator
  ports:
    - port: {{ .Values.aggregator.port }}
      targetPort: {{ .Values.aggregator.port }}
