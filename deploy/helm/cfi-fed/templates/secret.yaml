apiVersion: v1
kind: Secret
metadata:
  name: cfi-fed-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cfi-fed.labels" . | nindent 4 }}
type: Opaque
stringData:
  database_url: {{ required "registry.databaseUrl is required" .Values.registry.databaseUrl | quote }}
  {{- if .Values.audit.signingKeyPem }}
  audit_signing_key_pem: {{ .Values.audit.signingKeyPem | quote }}
  {{- end }}
