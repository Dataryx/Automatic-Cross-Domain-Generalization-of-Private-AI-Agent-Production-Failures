apiVersion: v1
kind: ConfigMap
metadata:
  name: cfi-fed-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cfi-fed.labels" . | nindent 4 }}
data:
  CFI_MINIMUM_COHORT_K: {{ .Values.config.minimumCohortK | quote }}
  CFI_TOTAL_EPSILON: {{ .Values.config.totalEpsilon | quote }}
  CFI_AUDIT_SINK_SIGNED: {{ .Values.audit.sinkSigned | quote }}
  CFI_AUDIT_SINK_WORM: {{ .Values.audit.sinkWorm | quote }}
  CFI_AUDIT_SINK_IDEMPOTENCY: {{ .Values.audit.sinkIdempotency | quote }}
  {{- if .Values.audit.sinkPath }}
  CFI_AUDIT_SINK_PATH: {{ .Values.audit.sinkPath | quote }}
  {{- end }}
  {{- if .Values.audit.sinkUrl }}
  CFI_AUDIT_SINK_URL: {{ .Values.audit.sinkUrl | quote }}
  {{- end }}
  CFI_REGISTRY_URL: {{ include "cfi-fed.registryUrl" . | quote }}
  CFI_COORDINATOR_URL: {{ include "cfi-fed.coordinatorUrl" . | quote }}
  CFI_AGGREGATOR_URL: {{ include "cfi-fed.aggregatorUrl" . | quote }}
  {{- if .Values.client.replayMockUrl }}
  CFI_REPLAY_MOCK_URL: {{ .Values.client.replayMockUrl | quote }}
  {{- else if .Values.replayHooks.enabled }}
  CFI_REPLAY_MOCK_URL: {{ include "cfi-fed.replayMockUrl" . | quote }}
  {{- end }}
  {{- if .Values.client.agentrxUrl }}
  CFI_AGENTRX_URL: {{ .Values.client.agentrxUrl | quote }}
  {{- else if .Values.replayHooks.enabled }}
  CFI_AGENTRX_URL: {{ include "cfi-fed.agentrxUrl" . | quote }}
  {{- end }}
  {{- if .Values.client.causalflowUrl }}
  CFI_CAUSALFLOW_URL: {{ .Values.client.causalflowUrl | quote }}
  {{- else if .Values.replayHooks.enabled }}
  CFI_CAUSALFLOW_URL: {{ include "cfi-fed.causalflowUrl" . | quote }}
  {{- end }}
  {{- if .Values.client.tauBenchUrl }}
  CFI_TAU_BENCH_URL: {{ .Values.client.tauBenchUrl | quote }}
  {{- else if .Values.replayHooks.enabled }}
  CFI_TAU_BENCH_URL: {{ include "cfi-fed.tauBenchUrl" . | quote }}
  {{- end }}
