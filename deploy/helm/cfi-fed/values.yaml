image:
  repository: cfi-fed
  tag: latest
  pullPolicy: IfNotPresent

namespace: cfi-fed
createNamespace: true

registry:
  replicas: 1
  port: 8000
  databaseUrl: ""  # set via --set registry.databaseUrl=... or secret

coordinator:
  replicas: 1
  port: 8001

aggregator:
  replicas: 1
  port: 8002

config:
  minimumCohortK: "10"
  totalEpsilon: "10.0"

audit:
  sinkSigned: "0"
  sinkWorm: "0"
  sinkIdempotency: "0"
  sinkPath: ""
  sinkUrl: ""
  signingKeyPem: ""

client:
  registryUrl: "http://cfi-registry:8000"
  coordinatorUrl: "http://cfi-coordinator:8001"
  aggregatorUrl: "http://cfi-aggregator:8002"
  replayMockUrl: ""
  agentrxUrl: ""
  causalflowUrl: ""
  tauBenchUrl: ""

ingress:
  enabled: false
  className: nginx
  host: cfi-fed.local
  tls: false
  # Strip /registry, /coordinator, /aggregator prefixes before forwarding (matches compose nginx).
  rewrite: true

replayHooks:
  enabled: false
  mock:
    port: 8010
    command: services/replay_mock/main.py
  agentrx:
    port: 8020
    command: services/agentrx_stub/main.py
  causalflow:
    port: 8021
    command: services/causalflow_stub/main.py
  tau:
    port: 8022
    command: services/tau_stub/main.py

resources: {}
