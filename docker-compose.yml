name: cfi-fed

services:
  registry:
    build: .
    command: python services/registry/main.py
    environment:
      CFI_DATABASE_URL: sqlite:////data/cfi_registry.db
      CFI_HOST: 0.0.0.0
      CFI_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - registry_data:/data

  coordinator:
    build: .
    command: uvicorn services.coordinator.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  aggregator:
    build: .
    command: python services/aggregator/main.py
    environment:
      CFI_TOTAL_EPSILON: "10.0"
      CFI_HOST: 0.0.0.0
      CFI_PORT: 8002
    ports:
      - "8002:8002"

  replay_mock:
    build: .
    command: python services/replay_mock/main.py
    environment:
      CFI_HOST: 0.0.0.0
      CFI_PORT: 8010
    ports:
      - "8010:8010"

  agentrx_stub:
    build: .
    command: python services/agentrx_stub/main.py
    environment:
      CFI_HOST: 0.0.0.0
      CFI_PORT: 8020
    ports:
      - "8020:8020"

  causalflow_stub:
    build: .
    command: python services/causalflow_stub/main.py
    environment:
      CFI_HOST: 0.0.0.0
      CFI_PORT: 8021
    ports:
      - "8021:8021"

volumes:
  registry_data:
