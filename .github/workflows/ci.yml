name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check packages tests eval --select F
      - name: Pytest
        run: pytest tests/ -q
      - name: Definition of Done
        run: python eval/verify_dod.py
      - name: Golden path
        run: python scripts/golden_path.py
      - name: Replay profiles
        run: python scripts/verify_replay_profiles.py
      - name: Field study
        run: python scripts/verify_field_study.py
      - name: TLS stack
        run: python scripts/verify_tls_stack.py
      - name: Observability
        run: python scripts/verify_observability.py
      - name: Production hardening
        run: python scripts/verify_production_hardening.py
      - name: Auth
        run: python scripts/verify_auth.py
      - name: Eval harnesses
        run: python scripts/verify_eval_harnesses.py
      - name: Corpus ingest
        run: python scripts/verify_corpus_ingest.py
      - name: Audit attestation
        run: python scripts/verify_audit_attestation.py
      - name: Helm chart
        run: python scripts/verify_helm_chart.py
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose stack smoke
        env:
          CFI_REQUIRE_DOCKER: "1"
        run: python scripts/verify_compose_stack.py
  postgres-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Postgres compose smoke
        env:
          CFI_REQUIRE_DOCKER: "1"
        run: python scripts/verify_postgres_compose.py
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Sim study Section 9
        run: python scripts/verify_sim.py
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mypy strict
        run: mypy packages/cfi_core/src packages/cfi_contributor/src packages/cfi_registry/src packages/cfi_recipient/src packages/cfi_federation/src packages/cfi_governance/src packages/cfi_cli/src services/replay_common.py services/registry services/coordinator services/aggregator services/replay_mock services/agentrx_stub services/causalflow_stub
  eval-all:
    runs-on: ubuntu-latest
    needs: [test, sim, mypy, compose, postgres-compose]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Full evaluation suite
        run: python eval/run_all.py
  release:
    runs-on: ubuntu-latest
    needs: [test, sim, mypy, compose, postgres-compose, eval-all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Package release
        run: python scripts/package_release.py
      - name: Verify release
        run: python scripts/verify_release.py
      - name: mTLS stack
        run: python scripts/verify_mtls.py
