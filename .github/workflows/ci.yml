name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check packages tests tools/evaluation --select F
      - name: Pytest
        run: pytest tests/ -q
      - name: Definition of Done
        run: python tools/evaluation/verify_dod.py
      - name: Golden path
        run: python scripts/ops/golden_path.py
      - name: Replay profiles
        run: python scripts/ci/verify_replay_profiles.py
      - name: Field study
        run: python scripts/ci/verify_field_study.py
      - name: TLS stack
        run: python scripts/ci/verify_tls_stack.py
      - name: Observability
        run: python scripts/ci/verify_observability.py
      - name: Production hardening
        run: python scripts/ci/verify_production_hardening.py
      - name: Auth
        run: python scripts/ci/verify_auth.py
      - name: Eval harnesses
        run: python scripts/ci/verify_eval_harnesses.py
      - name: Corpus batch ingest
        run: python scripts/ci/verify_corpus_batch.py
      - name: Live hooks
        env:
          CFI_REQUIRE_DOCKER: "1"
        run: python scripts/ci/verify_live_hooks.py
      - name: Helm deploy validation
        run: python scripts/ci/verify_helm_deploy.py
      - name: Audit attestation
        run: python scripts/ci/verify_audit_attestation.py
      - name: Helm chart
        run: python scripts/ci/verify_helm_chart.py
      - name: Remote registry CLI
        run: python scripts/ci/verify_remote_registry_cli.py
      - name: τ-live adapter
        run: python scripts/ci/verify_tau_live.py
      - name: Contribute publish
        run: python scripts/ci/verify_contribute_publish.py
      - name: Agent hooks
        run: python scripts/ci/verify_agent_hooks.py
      - name: Cross boundary
        run: python scripts/ci/verify_cross_boundary.py
      - name: Corpus publish
        run: python scripts/ci/verify_corpus_publish.py
      - name: End-to-end workflow
        run: python scripts/ci/verify_end_to_end.py
      - name: Federation workflow
        run: python scripts/ci/verify_federation_workflow.py
      - name: Full pipeline
        run: python scripts/ci/verify_full_pipeline.py
      - name: CLI endpoints
        run: python scripts/ci/verify_cli_endpoints.py
      - name: Pipeline matrix
        run: python scripts/ci/verify_pipeline_matrix.py
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose stack smoke
        env:
          CFI_REQUIRE_DOCKER: "1"
        run: python scripts/ci/verify_compose_stack.py
  postgres-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Postgres compose smoke
        env:
          CFI_REQUIRE_DOCKER: "1"
        run: python scripts/ci/verify_postgres_compose.py
  pipeline-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Full pipeline matrix (7 variants)
        env:
          CFI_REQUIRE_DOCKER: "1"
        run: python scripts/ci/verify_pipeline_matrix_ci.py
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Sim study Section 9
        run: python scripts/ci/verify_sim.py
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mypy strict
        run: mypy packages/cfi_core/src packages/cfi_contributor/src packages/cfi_registry/src packages/cfi_recipient/src packages/cfi_federation/src packages/cfi_governance/src packages/cfi_cli/src services/replay_common.py services/registry services/coordinator services/aggregator services/integrations/replay services/integrations/agentrx services/integrations/causalflow services/integrations/tau
  eval-all:
    runs-on: ubuntu-latest
    needs: [test, sim, mypy, compose, postgres-compose, pipeline-matrix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Full evaluation suite
        run: python tools/evaluation/run_all.py
  release:
    runs-on: ubuntu-latest
    needs: [test, sim, mypy, compose, postgres-compose, pipeline-matrix, eval-all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Package release
        run: python scripts/ops/package_release.py
      - name: Verify release
        run: python scripts/ci/verify_release.py
      - name: mTLS stack
        run: python scripts/ci/verify_mtls.py
